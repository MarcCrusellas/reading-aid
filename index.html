<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Aid</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1814;
    --ink-muted: #5a564e;
    --paper: #faf8f4;
    --bg: #ece8e0;
    --accent: #c0603a;
    --border: #d8d2c8;
    --line-1: rgba(192,96,58,0.06);
    --line-2: rgba(60,100,160,0.05);
    --line-3: rgba(40,130,80,0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Atkinson Hyperlegible', Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 0.6rem 1.25rem;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .topbar-options { display: flex; gap: 1.25rem; align-items: center; }

  .opt-label {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
  }

  .opt-label input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; }

  .topbar-right { margin-left: auto; display: flex; gap: 0.6rem; }

  button {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    border-radius: 3px;
    padding: 0.4rem 1rem;
    cursor: pointer;
    transition: opacity 0.15s;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-muted);
  }
  button:hover { background: var(--bg); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover { opacity: 0.85; }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    overflow: hidden;
  }

  .panel { display: flex; flex-direction: column; overflow: hidden; }

  .panel-label {
    font-family: 'DM Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-muted);
    opacity: 0.4;
    padding: 0.5rem 1.25rem 0.35rem;
    flex-shrink: 0;
  }

  .panel-left { border-right: 1px solid var(--border); background: #f4f0e8; }

  textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    padding: 0.25rem 1.25rem 1.5rem;
    font-family: 'Atkinson Hyperlegible', Georgia, serif;
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink);
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  textarea::placeholder { color: #b8b0a4; }

  .panel-right { background: var(--paper); overflow-y: auto; }

  .output { padding: 0.25rem 1.5rem 3rem 0.75rem; font-size: 15px; line-height: 1.9; }

  .placeholder-msg {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    opacity: 0.28;
    padding: 1.5rem 1.25rem;
  }

  .bio { font-weight: 700; }

  .para {
    margin-bottom: 1.4rem;
    padding: 0.15rem 0.5rem 0.15rem 2.4rem;
    border-left: 2.5px solid transparent;
    word-spacing: 0.03em;
    position: relative;
  }

  .para::before {
    content: attr(data-pnum);
    position: absolute;
    left: 0.35rem;
    top: 0.4rem;
    font-family: 'DM Mono', monospace;
    font-size: 8.5px;
    color: var(--ink-muted);
    opacity: 0.28;
    width: 1.5rem;
    text-align: right;
  }

  .para.has-repeat::before { opacity: 0.7; color: #9B3E1A; }

  .para:nth-child(4n+1) { background: var(--line-1); border-left-color: rgba(192,96,58,0.22); }
  .para:nth-child(4n+2) { background: var(--line-2); border-left-color: rgba(60,100,160,0.18); }
  .para:nth-child(4n+3) { background: var(--line-3); border-left-color: rgba(40,130,80,0.18); }

  .para.is-heading {
    font-weight: 700;
    font-size: 1.1em;
    margin-top: 1.8rem;
    margin-bottom: 0.5rem;
    border-left-width: 4px;
  }

  .repeat-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    background: rgba(192,96,58,0.09);
    color: #8B3A1A;
    border: 0.75px solid rgba(192,96,58,0.32);
    border-radius: 3px;
    padding: 1px 5px 1px 3px;
    margin-left: 7px;
    vertical-align: middle;
    white-space: nowrap;
  }

  .repeat-badge svg { flex-shrink: 0; }

  /* ── MODAL ── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,24,20,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: min(640px, 90vw);
    max-height: 75vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem 0.6rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .modal-header span {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .modal-actions { display: flex; gap: 0.5rem; }

  .modal-body { flex: 1; overflow: hidden; display: flex; }

  .modal-body textarea {
    flex: 1;
    padding: 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink);
    background: transparent;
    border: none;
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  .copy-confirm {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #3a7a4a;
    opacity: 0;
    transition: opacity 0.3s;
    align-self: center;
  }
  .copy-confirm.show { opacity: 1; }

  @media print {
    body { display: block; height: auto; overflow: visible; background: white; }
    .topbar, .panel-left, .panel-label { display: none !important; }
    .panels { display: block; }
    .panel-right { overflow: visible; background: white; }
    .output { padding: 1.5cm 2cm; font-size: 13pt; line-height: 1.9; }
    .para { break-inside: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Reading Aid</span>
  <div class="topbar-options">
    <label class="opt-label"><input type="checkbox" id="opt-bionic" checked> Bionic</label>
    <label class="opt-label"><input type="checkbox" id="opt-color" checked> Line tints</label>
    <label class="opt-label"><input type="checkbox" id="opt-repeat" checked> Repeat detection</label>
  </div>
  <div class="topbar-right">
    <button onclick="document.getElementById('input').value='';render()">Clear</button>
    <button onclick="openMarkdown()">Markdown ↗</button>
    <button class="primary" onclick="window.print()">Print / PDF</button>
  </div>
</div>

<div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span>Plain text / Markdown</span>
      <div class="modal-actions">
        <span class="copy-confirm" id="copy-confirm">Copied!</span>
        <button onclick="copyMarkdown()">Copy all</button>
        <button onclick="closeModal()">✕ Close</button>
      </div>
    </div>
    <div class="modal-body">
      <textarea id="md-out" readonly spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="panels">
  <div class="panel panel-left">
    <div class="panel-label">Input</div>
    <textarea id="input" placeholder="Paste your text here…&#10;&#10;Blank line = new paragraph.&#10;Single line breaks are preserved."></textarea>
  </div>
  <div class="panel panel-right">
    <div class="panel-label">Preview</div>
    <div class="output" id="output">
      <div class="placeholder-msg">Output appears here as you type…</div>
    </div>
  </div>
</div>

<script>
  function bionicWord(w) {
    if (w.length <= 1) return '<span class="bio">' + w + '</span>';
    const n = Math.max(1, Math.ceil(w.length / 2));
    return '<span class="bio">' + w.slice(0,n) + '</span>' + w.slice(n);
  }

  function processLine(text, useBionic) {
    if (!useBionic) return text;
    return text.split(/(\s+)/).map(t => /\s/.test(t) ? t : bionicWord(t)).join('');
  }

  function looksLikeHeading(s) {
    return s.length < 80 && !s.endsWith('.') && !s.endsWith(',') && !s.endsWith(';');
  }

  function normalize(t) { return t.toLowerCase().replace(/[^\w\s]/g,'').trim(); }
  function wordSet(t) { return new Set(normalize(t).split(/\s+/).filter(w => w.length > 2)); }

  function similarity(a, b) {
    if (a.length < 20 && b.length < 20) return normalize(a) === normalize(b) ? 1 : 0;
    const sa = wordSet(a), sb = wordSet(b);
    if (!sa.size && !sb.size) return 1;
    if (!sa.size || !sb.size) return 0;
    let inter = 0;
    for (const w of sa) if (sb.has(w)) inter++;
    return inter / (sa.size + sb.size - inter);
  }

  function findRepeats(paras) {
    const n = paras.length;
    const par = Array.from({length:n},(_,i)=>i);
    const find = x => par[x]===x ? x : (par[x]=find(par[x]));
    const unite = (x,y) => { par[find(x)]=find(y); };
    for (let i=0;i<n;i++)
      for (let j=i+1;j<n;j++)
        if (similarity(paras[i],paras[j])>=0.65) unite(i,j);
    const groups={};
    for (let i=0;i<n;i++) { const r=find(i); (groups[r]=groups[r]||[]).push(i); }
    const map={};
    for (const g of Object.values(groups))
      if (g.length>1)
        for (const i of g) map[i]={total:g.length,others:g.filter(x=>x!==i)};
    return map;
  }

  function badge(total, others) {
    const svg = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1.5A3.5 3.5 0 1 0 8.2 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8.5 3v3H5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return `<span class="repeat-badge">${svg} ×${total} · ${others.map(i=>`¶${i+1}`).join(' ')}</span>`;
  }

  function render() {
    const raw = document.getElementById('input').value;
    const out = document.getElementById('output');
    if (!raw.trim()) {
      out.innerHTML = '<div class="placeholder-msg">Output appears here as you type…</div>';
      return;
    }
    const useBionic = document.getElementById('opt-bionic').checked;
    const useColor  = document.getElementById('opt-color').checked;
    const useRepeat = document.getElementById('opt-repeat').checked;
    const paras = raw.split(/\n{2,}/).filter(p=>p.trim());
    const repeatMap = useRepeat ? findRepeats(paras) : {};
    out.innerHTML = paras.map((para,idx) => {
      const lines = para.split('\n');
      const isHeading = lines.length===1 && looksLikeHeading(lines[0].trim());
      const processed = lines.map((line,li) => {
        const p = processLine(line.trim(), useBionic && !isHeading);
        return (li===lines.length-1 && repeatMap[idx])
          ? p + badge(repeatMap[idx].total, repeatMap[idx].others)
          : p;
      }).join('<br>');
      const cls = ['para', isHeading&&'is-heading', repeatMap[idx]&&'has-repeat'].filter(Boolean).join(' ');
      const style = useColor ? '' : ' style="background:transparent;border-left-color:transparent"';
      return `<p class="${cls}" data-pnum="${idx+1}"${style}>${processed}</p>`;
    }).join('');
  }

  let timer;
  document.getElementById('input').addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(render, 180);
  });

  ['opt-bionic','opt-color','opt-repeat'].forEach(id =>
    document.getElementById(id).addEventListener('change', render)
  );

  function bionicWordMd(w) {
    if (w.length <= 1) return '**' + w + '**';
    const n = Math.max(1, Math.ceil(w.length / 2));
    return '**' + w.slice(0, n) + '**' + w.slice(n);
  }

  function processLineMd(text) {
    return text.split(/(\s+)/).map(t => /\s/.test(t) ? t : bionicWordMd(t)).join('');
  }

  function toMarkdown() {
    const raw = document.getElementById('input').value.trim();
    if (!raw) return '';
    const useBionic = document.getElementById('opt-bionic').checked;
    const paras = raw.split(/\n{2,}/).filter(p => p.trim());
    const repeatMap = document.getElementById('opt-repeat').checked ? findRepeats(paras) : {};
    const parts = [];
    paras.forEach((para, idx) => {
      const lines = para.split('\n');
      const isHeading = lines.length === 1 && looksLikeHeading(lines[0].trim());
      const rep = repeatMap[idx];
      if (isHeading) {
        parts.push('\n## ' + lines[0].trim() + '\n');
      } else {
        const processed = lines.map(l => useBionic ? processLineMd(l.trim()) : l.trim()).join('\n');
        const repNote = rep
          ? '\n> ↺ repeated ×' + rep.total + ' — also at ' + rep.others.map(i => '¶' + (i+1)).join(', ') + '\n'
          : '';
        parts.push(processed + repNote);
      }
    });
    return parts.join('\n\n---\n\n');
  }

  function openMarkdown() {
    const md = toMarkdown();
    if (!md) return;
    document.getElementById('md-out').value = md;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  function copyMarkdown() {
    const ta = document.getElementById('md-out');
    ta.select();
    navigator.clipboard.writeText(ta.value).then(() => {
      const el = document.getElementById('copy-confirm');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    });
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
